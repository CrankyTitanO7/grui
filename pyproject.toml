[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grui"
version = "0.1.0"
description = "GRUI (Grand Unified Imitation): captures screen and input into timestamped raw demonstrations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "grui contributors" }]
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "pynput>=1.7",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "imageio-ffmpeg>=0.4",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["torch>=2.0"]

[project.scripts]
grui = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "recorder*", "storage*", "dataset*", "editor*", "player*", "ml*"]

[tool.setuptools.package-data]
dataset = ["README.md"]
ml = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
