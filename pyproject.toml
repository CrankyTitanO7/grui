[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grui"
version = "0.1.0"
description = "GRUI (Grand Unified Imitation): captures screen and input into timestamped raw demonstrations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "grui contributors" }]
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "pynput>=1.7",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "imageio-ffmpeg>=0.4",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["torch>=2.0"]
# Optional perception provider: NVIDIA LocateAnything (see perception/providers/).
# The nvidia/LocateAnything-3B model itself is gated on Hugging Face (login
# required) and needs a CUDA GPU; check its license before commercial use.
locate = [
    "locate-anything>=0.1.0",
    # official HF download accelerator for repos stored on Xet storage
    # (LocateAnything-3B is one): `huggingface_hub[hf_xet]`
    "hf-xet>=1.1",
]

# locate-anything 0.1.0 pins numpy==2.0.2 and Pillow==11.1.0, which have no
# Python 3.14 Windows wheels (and no compiler on most Windows setups), so the
# [locate] extra can't be installed there without these overrides. numpy 2.x
# and Pillow 12.x are fine for the whole stack (torch/transformers support them).
[tool.uv]
override-dependencies = ["numpy>=2.1", "Pillow>=11.2"]

[project.scripts]
grui = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "recorder*", "storage*", "dataset*", "editor*", "player*", "ml*", "perception*"]

[tool.setuptools.package-data]
dataset = ["README.md"]
ml = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
